<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found: NarraTrace</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="wordmark" href="/"><span>Narra</span><span class="trace">Trace</span></a>
      <details class="nav-disclosure" open>
        <summary class="nav-toggle"><span class="when-open">Hide menu</span><span class="when-closed">Show menu</span></summary>
        <nav class="nav" aria-label="Main">
          <a href="/">Home</a>
          <a href="/#tools">Tools</a>
          <a href="/#docs">Documentation</a>
          <a href="/#progress">Progress</a>
          <a href="/about/">About</a>
          <a href="/o1/">O1</a>
        </nav>
      </details>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <section class="grid not-found" aria-labelledby="title">
        <div class="cell">
          <h1 id="title">There's no page at this address</h1>
          <p class="lede">Windmill and MLflow have addresses of their own: windmill.{{env "DOMAIN"}} and mlflow.{{env "DOMAIN"}}.</p>
          <div class="actions">
            <a class="btn btn-primary" href="/">Go to the home page</a>
            <a class="btn" href='{{env "PUBLIC_SCHEME"}}://windmill.{{env "DOMAIN"}}/'>Open Windmill</a>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
