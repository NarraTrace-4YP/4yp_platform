summary: "O1: corpus preparation"
description: >-
  Builds O1 (a hierarchical, standardised DHR corpus linked to the Home Office DHR
  Library's case metadata) from scratch, one step after another: load DHRC-100, load
  DHRC-RAW, collect the case metadata, group each dataset's blocks by section, find each
  section's candidate template sections (against the 2016 guidance, or the 2026 one), then
  report where O1 stands. Each
  step can be switched off. The last O1 step (an LLM choosing the template section) will be
  added here when it is built. The O1 app (f/dhr/o1) explains each step and can start this.
value:
  modules:
    - id: load_dhrc_100
      summary: Load DHRC-100 (the 100 checked reviews)
      skip_if:
        expr: flow_input.load_dhrc_100 === false
      value:
        type: script
        path: f/dhr/load_dhrc
        input_transforms:
          dataset:
            type: static
            value: DHRC-100
          revision:
            type: javascript
            expr: flow_input.dhrc_100_revision || "main"
    - id: load_dhrc_raw
      summary: Load DHRC-RAW (all 702 reviews, unchecked)
      skip_if:
        expr: flow_input.load_dhrc_raw === false
      value:
        type: script
        path: f/dhr/load_dhrc
        input_transforms:
          dataset:
            type: static
            value: DHRC-RAW
          revision:
            type: javascript
            expr: flow_input.dhrc_raw_revision || "main"
    - id: collect_case_metadata
      summary: Collect the case metadata from the DHR Library (about 20 minutes)
      skip_if:
        expr: flow_input.collect_case_metadata === false
      value:
        type: script
        path: f/dhr/collect_case_metadata
        input_transforms:
          max_filters:
            type: static
            value: 0
          delay_seconds:
            type: static
            value: 1
          dry_run:
            type: static
            value: false
    - id: group_sections_100
      summary: Group DHRC-100's blocks by section (from the checked headings)
      skip_if:
        expr: flow_input.group_sections_100 === false
      value:
        type: script
        path: f/dhr/group_sections
        input_transforms:
          dataset:
            type: static
            value: DHRC-100
    - id: group_sections_raw
      summary: Group DHRC-RAW's blocks by section (from Datalab's own headings)
      skip_if:
        expr: flow_input.group_sections_raw === false
      value:
        type: script
        path: f/dhr/group_sections
        input_transforms:
          dataset:
            type: static
            value: DHRC-RAW
    - id: template_candidates_100
      summary: Find DHRC-100's candidate template sections (about 5 minutes)
      skip_if:
        expr: flow_input.template_candidates_100 === false
      value:
        type: script
        path: f/dhr/find_template_candidates
        input_transforms:
          dataset:
            type: static
            value: DHRC-100
          guidance:
            type: javascript
            expr: flow_input.template_guidance || "dhr-2016"
    - id: template_candidates_raw
      summary: Find DHRC-RAW's candidate template sections (about 40 minutes)
      skip_if:
        expr: flow_input.template_candidates_raw === false
      value:
        type: script
        path: f/dhr/find_template_candidates
        input_transforms:
          dataset:
            type: static
            value: DHRC-RAW
          guidance:
            type: javascript
            expr: flow_input.template_guidance || "dhr-2016"
    - id: status
      summary: Report where O1 stands
      value:
        type: script
        path: f/dhr/o1_status
        input_transforms: {}
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - load_dhrc_100
    - dhrc_100_revision
    - load_dhrc_raw
    - dhrc_raw_revision
    - collect_case_metadata
    - group_sections_100
    - group_sections_raw
    - template_candidates_100
    - template_candidates_raw
    - template_guidance
  properties:
    load_dhrc_100:
      type: boolean
      default: true
      description: Load DHRC-100 from Hugging Face.
    dhrc_100_revision:
      type: string
      default: main
      description: Which version of DHRC-100 (main is the latest, or give a commit id).
    load_dhrc_raw:
      type: boolean
      default: true
      description: Load DHRC-RAW from Hugging Face.
    dhrc_raw_revision:
      type: string
      default: main
      description: Which version of DHRC-RAW (main is the latest, or give a commit id).
    collect_case_metadata:
      type: boolean
      default: true
      description: >-
        Collect a fresh snapshot of the case metadata from the DHR Library (about 20
        minutes). Not needed after loading a dataset: one snapshot covers every dataset.
    group_sections_100:
      type: boolean
      default: true
      description: >-
        Group DHRC-100's blocks by section, using the headings the team checked. Needed
        after loading DHRC-100 (a reload removes the old grouping).
    group_sections_raw:
      type: boolean
      default: true
      description: >-
        Group DHRC-RAW's blocks by section, using Datalab's own (unchecked) headings.
        Needed after loading DHRC-RAW.
    template_candidates_100:
      type: boolean
      default: true
      description: >-
        Find the template sections each DHRC-100 section might be (fuzzy heading match and
        embeddings against the 2016 guidance's templates). Needed after grouping DHRC-100.
    template_candidates_raw:
      type: boolean
      default: true
      description: >-
        The same for DHRC-RAW (about 40 minutes on the server's CPU). Needed after grouping
        DHRC-RAW.
    template_guidance:
      type: string
      default: dhr-2016
      enum:
        - dhr-2016
        - dardr-2026
      description: >-
        Whose templates to match the sections against: the 2016 DHR guidance (the one the
        specification uses, and the reviews were written under) or the September 2026 DARDR
        guidance. Candidates against the other are kept.
  required: []
