# Everything the project runs locally or on the server, in one file.
# Start or update it with:  docker compose up -d --build
# Secrets and names come from the selected env file. Servers use .env; local development
# uses .env.local (copy .env.local.example).

name: dhr

# Windmill's own images, all on the same version. To upgrade Windmill, change the version
# here and wherever else it appears (tests/test_windmill_scripts.py lists them and fails
# until they all agree), then run update.sh.
x-windmill: &windmill
  image: ghcr.io/windmill-labs/windmill:1.875.0
  restart: unless-stopped
  depends_on:
    windmill-db:
      condition: service_healthy

x-windmill-env: &windmill-env
  DATABASE_URL: postgres://postgres:${WINDMILL_DB_PASSWORD}@windmill-db:5432/windmill?sslmode=disable

services:
  # PostgreSQL with pgvector (meaning search) and pg_search (keyword search) built in.
  # Holds the project database "dhr" plus MLflow's own records.
  postgres:
    image: paradedb/paradedb:0.26.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dhr
      # Read once, by postgres/20-project.sh, when the database is first created.
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mounted as a single file so ParadeDB's own start-up script still runs first.
      - ./postgres/20-project.sh:/docker-entrypoint-initdb.d/20-project.sh:ro
    # Only reachable from the server itself (teammates use an SSH tunnel). Never public.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    mem_limit: 2g
    shm_size: 256m
    healthcheck:
      # Readiness alone is not enough: if a one-time init script fails, Postgres can
      # restart and accept connections with the project roles and schemas missing.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d dhr &&
          psql -U postgres -d dhr -Atqc
          "SELECT 1 WHERE EXISTS (SELECT FROM pg_roles WHERE rolname = 'pipeline')
          AND to_regnamespace('corpus') IS NOT NULL" | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Windmill's own records (scripts, runs, users), kept apart from the project data.
  windmill-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${WINDMILL_DB_PASSWORD}
      POSTGRES_DB: windmill
    volumes:
      - windmill-db-data:/var/lib/postgresql
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windmill"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The Windmill website and API. Reachable on the server itself at 127.0.0.1:8000 (the
  # server scripts use that), and from outside only through Caddy over HTTPS.
  windmill-server:
    <<: *windmill
    environment:
      <<: *windmill-env
      MODE: server
    ports:
      - "127.0.0.1:${WINDMILL_HOST_PORT:-8000}:8000"
    volumes:
      - windmill-worker-logs:/tmp/windmill/logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Runs the pipeline scripts, two at a time. Each run is limited to 2 GB of memory.
  windmill-worker:
    <<: *windmill
    environment:
      <<: *windmill-env
      MODE: worker
      WORKER_GROUP: default
      # Keeps a running script from reading the worker's own settings and passwords.
      FAVOR_UNSHARE_PID: "true"
    privileged: true
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
    volumes:
      - windmill-worker-cache:/tmp/windmill/cache
      - windmill-worker-logs:/tmp/windmill/logs

  # Runs Windmill's own small built-in jobs, so they never wait behind a long pipeline.
  windmill-worker-native:
    <<: *windmill
    environment:
      <<: *windmill-env
      MODE: worker
      WORKER_GROUP: native
      NATIVE_MODE: "true"
      SLEEP_QUEUE: "200"
    mem_limit: 1g
    volumes:
      - windmill-worker-logs:/tmp/windmill/logs

  # Gives the web editor its Python autocomplete and error checking.
  windmill-extra:
    image: ghcr.io/windmill-labs/windmill-extra:1.875.0
    restart: unless-stopped
    environment:
      ENABLE_LSP: "true"
      ENABLE_MULTIPLAYER: "false"
      ENABLE_DEBUGGER: "false"
      WINDMILL_BASE_URL: http://windmill-server:8000
    volumes:
      - windmill-lsp-cache:/pyls/.cache
    mem_limit: 1g
    depends_on:
      - windmill-server

  # Explicit local-only tool: provisions the dhr workspace and pushes this checkout's
  # f/dhr scripts, flow and app to local Windmill. The profile keeps it out of normal
  # server startup/update commands. It has no GitHub credentials or sync behavior.
  windmill-bootstrap:
    profiles: ["local-tools"]
    build: ./local
    image: dhr-local-windmill-bootstrap:local
    environment:
      WINDMILL_INTERNAL_URL: http://windmill-server:8000
      WINDMILL_PUBLIC_URL: ${PUBLIC_SCHEME:-https}://windmill.${DOMAIN}
      WINDMILL_ADMIN_PASSWORD: ${WINDMILL_ADMIN_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Read-only by design: metadata generation happens in the container's /tmp copy,
      # so importing cannot reformat or otherwise alter the developer's checkout.
      - .:/source:ro
      # The only writable checkout path: instance-specific public embed URLs. This
      # directory is ignored by Git and served read-only by Caddy.
      - ./runtime:/runtime
    depends_on:
      windmill-server:
        condition: service_healthy

  # Records every experiment run and LLM call. Each person has their own login.
  mlflow:
    build: ./mlflow
    image: dhr-mlflow:local
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
      MLFLOW_AUTH_DB_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow_auth
      MLFLOW_AUTH_ADMIN_USERNAME: admin
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY}
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_DISABLE_AGENT_HINT: "true"
      MLFLOW_ALLOWED_HOSTS: mlflow.${DOMAIN},mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # The LLM gateway: an OpenAI-style API to the model on Blythe, for the team's code
  # (gateway/README.md). Each call runs on the caller's own Blythe account, found from their
  # Windmill token. Only reachable inside the server: Windmill scripts use
  # http://llm-gateway:8000/v1, laptops an SSH tunnel to 127.0.0.1:8100. Never public.
  llm-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: dhr-llm-gateway:local
    restart: unless-stopped
    environment:
      WINDMILL_URL: http://windmill-server:8000
      WINDMILL_WORKSPACE: dhr
    ports:
      - "127.0.0.1:${LLM_GATEWAY_HOST_PORT:-8100}:8000"
    volumes:
      - llm-gateway-data:/data
    mem_limit: 512m
    depends_on:
      - windmill-server

  # WeKnora (github.com/Tencent/WeKnora): a knowledge-base website whose wiki mode turns
  # uploaded reviews into linked entity, concept and summary pages with a graph view.
  # Public at weknora.<DOMAIN> through Caddy, with the logins server/team.sh makes (new
  # sign-ups are blocked in the Caddyfile). Its models are added by each person on its
  # website, pointing at the LLM gateway with their own Windmill token. See docs/weknora.md.
  # To upgrade, change v0.9.0 on all three images together.
  #
  # Creates WeKnora's own database and login inside the shared Postgres, then exits. It
  # runs on every start and changes nothing once they exist, so it also sets up servers
  # whose database was created before WeKnora was added.
  weknora-db-init:
    image: paradedb/paradedb:0.26.6-pg17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      WEKNORA_DB_PASSWORD: ${WEKNORA_DB_PASSWORD}
    volumes:
      - ./postgres/weknora-init.sh:/weknora-init.sh:ro
    entrypoint: ["bash", "/weknora-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  weknora-redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${WEKNORA_REDIS_PASSWORD}
    volumes:
      - weknora-redis-data:/data
    mem_limit: 256m

  # Reads uploaded files (PDF, Word, Markdown and so on) into text for weknora-app.
  weknora-docreader:
    image: wechatopenai/weknora-docreader:v0.9.0
    restart: unless-stopped
    environment:
      TZ: Europe/London
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      DOCREADER_GRPC_MAX_WORKERS: "2"
      DOCREADER_PREPROCESS_MEMORY_MB: "1024"
    volumes:
      - weknora-docreader-tmp:/tmp/docreader
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  weknora-app:
    image: wechatopenai/weknora-app:v0.9.0
    restart: unless-stopped
    environment:
      GIN_MODE: release
      LOG_LEVEL: info
      TZ: Europe/London
      # Wiki pages, summaries and questions are written in English.
      WEKNORA_LANGUAGE: en-US
      AUTO_MIGRATE: "true"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: weknora
      DB_PASSWORD: ${WEKNORA_DB_PASSWORD}
      DB_NAME: weknora
      RETRIEVE_DRIVER: postgres
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      DOCREADER_ADDR: weknora-docreader:50051
      DOCREADER_TRANSPORT: grpc
      REDIS_ADDR: weknora-redis:6379
      REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD}
      JWT_SECRET: ${WEKNORA_JWT_SECRET}
      SYSTEM_AES_KEY: ${WEKNORA_AES_KEY}
      SYSTEM_SIGNING_KEY: ${WEKNORA_SIGNING_KEY}
      # This person becomes WeKnora's system admin when server/team.sh creates their login.
      WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-}
      WEKNORA_AUTH_DEFAULT_TENANT_MODE: create_personal
      # WeKnora refuses to call addresses inside the server unless they are listed. The
      # LLM gateway is the only one it needs.
      SSRF_WHITELIST_EXTRA: llm-gateway
      MAX_FILE_SIZE_MB: "50"
      OLLAMA_OPTIONAL: "true"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
      # The knowledge graph (entity-relationship extraction) lives in weknora-neo4j
      # (Rowan, 25 Nov 2026). Without these, WeKnora says the graph database is not enabled.
      NEO4J_ENABLE: "true"
      NEO4J_URI: bolt://weknora-neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${WEKNORA_GRAPH_PASSWORD}
    volumes:
      - weknora-files:/data/files
      - weknora-docreader-tmp:/tmp/docreader:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      weknora-db-init:
        condition: service_completed_successfully
      weknora-redis:
        condition: service_started
      weknora-docreader:
        condition: service_healthy
      weknora-neo4j:
        condition: service_healthy

  # The graph database for WeKnora's knowledge graph: the entities and relationships an LLM
  # pulls out of each chunk of a review (not the wiki's page-link graph, which lives in
  # WeKnora's Postgres). Only weknora-app reaches it, on the Docker network; no port is
  # opened on the server. WeKnora's queries need the APOC plugin, which the image includes.
  weknora-neo4j:
    image: neo4j:2025.10.1
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${WEKNORA_GRAPH_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - weknora-neo4j-data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7687'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # WeKnora's website. Caddy serves it at weknora.<DOMAIN>; it passes /api to weknora-app.
  weknora-frontend:
    image: wechatopenai/weknora-ui:v0.9.0
    restart: unless-stopped
    environment:
      APP_HOST: weknora-app
      APP_PORT: "8080"
      APP_SCHEME: http
      MAX_FILE_SIZE_MB: "50"
      DEFAULT_LOCALE: en-US
    mem_limit: 128m
    depends_on:
      weknora-app:
        condition: service_healthy

  # The only thing open to the internet: serves Windmill, MLflow and WeKnora over HTTPS,
  # and gets and renews the certificates automatically.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Existing server .env files do not have this setting, so HTTPS remains the default.
      # Local development sets it to http because .localhost needs no TLS certificate.
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
      - "${HTTPS_HOST_PORT:-443}:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro
      - ./runtime:/srv/runtime:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - windmill-server
      - mlflow

volumes:
  postgres-data:
  windmill-db-data:
  windmill-worker-cache:
  windmill-worker-logs:
  windmill-lsp-cache:
  mlflow-artifacts:
  caddy-data:
  caddy-config:
  llm-gateway-data:
  weknora-files:
  weknora-docreader-tmp:
  weknora-redis-data:
  weknora-neo4j-data:
