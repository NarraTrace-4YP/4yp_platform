# Deploys the team's pipelines (f/dhr) to Windmill whenever main changes, so Windmill
# always runs what's on main. Needs two repo settings (Settings > Secrets and variables >
# Actions), which server/setup.sh prints at the end:
#   - secret   WINDMILL_TOKEN: the deploy token (WINDMILL_DEPLOY_TOKEN in the server's .env)
#   - variable WINDMILL_URL:   e.g. https://windmill.example.com/
# To deploy again by hand: Actions > deploy > Run workflow.
#
# People can also edit f/dhr in Windmill's web editor; those edits come back to GitHub as a
# pull request (windmill-to-github.yml). So this first checks Windmill has no edits it
# would overwrite, and afterwards saves what Windmill holds (.github/windmill_sync.py).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "f/**"
      - "wmill.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/windmill_sync.py"
      - ".github/check_objective_embed.py"
  workflow_dispatch:
    inputs:
      overwrite_windmill_edits:
        description: "Overwrite edits made in Windmill that aren't on GitHub yet"
        type: boolean
        default: false

# One deploy at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # to save what Windmill holds on the windmill-snapshot branch

jobs:
  windmill:
    name: Deploy to Windmill
    runs-on: ubuntu-24.04
    env:
      WINDMILL_URL: ${{ vars.WINDMILL_URL }}
      WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy settings are there
        run: |
          if [[ -z "$WINDMILL_URL" || -z "$WINDMILL_TOKEN" ]]; then
            echo "::error::Add the WINDMILL_URL variable and the WINDMILL_TOKEN secret to this repo (see the top of this file)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Keep this version the same as the server's (compose.yaml).
      - run: npm install --global --no-audit --no-fund windmill-cli@1.875.0

      # Stops if someone edited f/dhr in Windmill and this commit doesn't have those edits
      # yet: deploying would overwrite them. Merge the "Changes made in Windmill" pull
      # request first (the message says how).
      - name: Check Windmill has no edits this would overwrite
        env:
          OVERWRITE_WINDMILL_EDITS: ${{ inputs.overwrite_windmill_edits }}
        run: python3 .github/windmill_sync.py guard

      - name: Record which commit is being deployed
        run: sed -i "s/^GIT_COMMIT = .*/GIT_COMMIT = \"$GITHUB_SHA\"/" f/dhr/version.py

      # Works out each script's inputs, and resolves its pinned packages into a lockfile.
      - name: Prepare the scripts for Windmill
        run: wmill generate-metadata --yes --workspace dhr --base-url "$WINDMILL_URL" --token "$WINDMILL_TOKEN"

      # The generated metadata has empty summaries, which the push would send to Windmill;
      # each script's summary is the first line of its docstring instead.
      - name: Give each script its summary
        run: python3 .github/script_summaries.py

      # Each script's version history in Windmill shows the commit it came from.
      - name: Push to Windmill
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'deployed by hand' }}
        run: |
          wmill sync push --yes \
            --workspace dhr --base-url "$WINDMILL_URL" --token "$WINDMILL_TOKEN" \
            --message "GitHub ${GITHUB_SHA::7}: ${COMMIT_MESSAGE%%$'\n'*}"

      # The app-level share ID is stable across versions but differs by Windmill instance.
      # server/update.sh writes it into the landing page's ignored runtime configuration.
      - name: Publish and verify embedded objective apps
        id: objective_apps
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WINDMILL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"execution_mode":"anonymous","skip_draft_deletion":true}' \
            "${WINDMILL_URL%/}/api/w/dhr/apps/update/f/dhr/O1/app"
          secret=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $WINDMILL_TOKEN" \
            "${WINDMILL_URL%/}/api/w/dhr/apps/secret_of/f/dhr/O1/app")
          test "$(curl --fail-with-body --silent --show-error \
            "${WINDMILL_URL%/}/api/w/dhr/apps_u/public_app/$secret" | jq -r .path)" = "f/dhr/O1/app"
          echo "public_url=${WINDMILL_URL%/}/public/dhr/$secret" >> "$GITHUB_OUTPUT"

      # So that later edits made in Windmill can be told apart from this deploy.
      - name: Remember what Windmill holds now
        run: python3 .github/windmill_sync.py snapshot

      # A moved app receives a new share ID. The website's runtime file lives on the
      # server, outside this runner. Catch a stale URL rather than report a healthy embed.
      # Snapshot first: the app is already deployed and must not appear as a web edit.
      - name: Verify the website embeds the current O1 app
        env:
          O1_PUBLIC_URL: ${{ steps.objective_apps.outputs.public_url }}
        run: python3 .github/check_objective_embed.py --windmill-url "$WINDMILL_URL" --public-url "$O1_PUBLIC_URL"
