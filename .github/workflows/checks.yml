# Runs on every pull request. Make these checks required before merging into main
# (Settings > Rules > Rulesets; see docs/server-setup.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]
  # Lets windmill-to-github.yml run the checks on its pull request: GitHub doesn't start
  # workflows for branches a workflow pushed.
  workflow_dispatch:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  windmill:
    name: Windmill scripts are valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The same version as the server (compose.yaml), for the same parser Windmill uses.
      - run: npm install --no-save --no-audit --no-fund windmill-cli@1.875.0
      - run: node .github/check_windmill_scripts.mjs
      # Flows (f/**/*.flow/flow.yaml) against Windmill's flow schema.
      - run: npx --no-install wmill lint f
      # Each app: its structure, and that its frontend builds.
      - name: Check the apps
        run: |
          for app in f/*/*.raw_app; do
            npx --no-install wmill app lint "$app"
          done

  server-config:
    name: Server config is valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && docker compose config --quiet
      - name: Check the shell scripts' syntax
        run: |
          for script in server/*.sh postgres/20-project.sh mlflow/start.sh; do
            bash -n "$script"
          done
