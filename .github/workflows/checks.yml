# Runs on every pull request. Make these checks required before merging into main
# (Settings > Rules > Rulesets; see docs/server-setup.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]
  # Lets windmill-to-github.yml run the checks on its pull request: GitHub doesn't start
  # workflows for branches a workflow pushed.
  workflow_dispatch:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check f/dhr
      - run: uv run pytest

  formatting:
    name: Frontend formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check

  windmill:
    name: Windmill scripts are valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The same version as the server (compose.yaml), for the same parser Windmill uses.
      - run: npm install --no-save --no-audit --no-fund windmill-cli@1.875.0
      - run: node .github/check_windmill_scripts.mjs
      # Flows (f/**/*.flow/flow.yaml) against Windmill's flow schema.
      - run: npx --no-install wmill lint f
      # Each app: its structure, and that its frontend builds.
      - name: Check the apps
        run: |
          while IFS= read -r -d '' app; do
            npx --no-install wmill app lint "$app"
          done < <(find f -type d -name '*.raw_app' -not -path '*/node_modules/*' -print0)

  server-config:
    # Keep this display name stable: the repository ruleset may require it by name.
    # The steps below validate both deployment environments despite the historical name.
    name: Server config is valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check both Compose environments
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.local.example config --quiet
      - name: Check Caddy in both environments
        run: |
          docker run --rm \
            --env PUBLIC_SCHEME=https --env DOMAIN=example.com --env ACME_EMAIL=admin@example.com \
            --mount type=bind,source="$PWD/caddy",target=/etc/caddy,readonly \
            --entrypoint caddy \
            caddy:2 validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            --env PUBLIC_SCHEME=http --env DOMAIN=localhost --env ACME_EMAIL=local@example.invalid \
            --mount type=bind,source="$PWD/caddy",target=/etc/caddy,readonly \
            --entrypoint caddy \
            caddy:2 validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check the shell scripts' syntax
        run: |
          for script in server/*.sh postgres/20-project.sh mlflow/start.sh; do
            bash -n "$script"
          done
